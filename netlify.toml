# hmm.ventures, the single-scroll thesis site. Static, no build step.
# This replaced the prior Astro site on 2026-08-11.
# The full prior Astro site (19 routes) is preserved and recoverable:
#   branch: astro-legacy   tag: astro-site-2026-06-16

# The build command runs the five non-browser guards so a failing check fails the
# deploy. check-opener-patterns joined them on 2026-09-14 under R-D26: two lexical
# patterns, a regulator cast as an actor and a first-person or pointer close, run over
# the served text of every page. check-register-figures grew a third block the same day,
# for the per-market strength snapshot the market charts read. --ignore-scripts skips the Playwright Chromium postinstall, which these
# checks do not need: check:machines is static too, evaluating machines.js against a
# recording stub of hmmH. GitHub Actions (.github/workflows/ci.yml) runs the full set.
[build]
  command = "npm ci --ignore-scripts && npm run check:csp && npm run check:tokens && node scripts/check-register-figures.mjs && node scripts/check-opener-patterns.mjs && npm run check:machines"
  publish = "."

# Caching and content-type rules also live in the /_headers file.
